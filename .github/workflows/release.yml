name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Claude apps expect <skill>/SKILL.md at the top of each zip, one zip per skill
      - name: Package skills
        working-directory: skills
        run: for skill in */; do zip -r "../${skill%/}.zip" "${skill%/}"; done

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" *.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
